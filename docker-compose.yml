services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - backend

  database:
    container_name: database
    build:
      context: ./database
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:5000"
    networks:
      - backend
    depends_on:
      - database:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
