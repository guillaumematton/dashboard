services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - backend

  database:
    container_name: database
    build:
      context: ./database
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
